<html>

<head>
    <title>From Validation</title>

</head>

<body>

    <form name="myForm" id="myForm" 17 onsubmit="return validateForm()" method="post">
        First Name: <input type="text" id="fname" name="fname"><br><br>
        Last Name: <input type="text" id="lname" name="lname"><br><br>
        Email : <input type="text" id="email" name="email"><br><br>
        Phone Number: <input type="text" id="phoneNumber" name="phoneNumber"><br><br>
        <input type="submit" value="Submit">
    </form>

</body>
<script>
    function validateForm() {
        var fname = document.getElementById("fname").value;
        var lname = document.getElementById("lname").value;
        var email = document.getElementById("email").value;
        var phoneNumber = document.getElementById("phoneNumber").value;

        if (fname == "" || lname == "") {
            alert("Name must be filled out");
            return false;

        }
        else if (!email.includes("@") || !email.includes(".")) {
            alert("Invalid email");
            return false;

        }
        else if (phoneNumber.length !== 11 || isNaN(phoneNumber)) {
            alert("Invalid phone number");
            return false;

        }

    }

    document.getElementById("myForm").addEventListener("submit", function (event) {
        var fname = document.getElementById("fname").value;
        var lname = document.getElementById("lname").value;
        if (fname == "" || lname == "") {
            alert("Name must be filled out");
            event.preventDefault();
        }
        var email = document.getElementById("email").value;
        if (!email.includes("@") || !email.includes(".")) {
            alert("Invalid email");
            event.preventDefault();
        }
        var phoneNumber = document.getElementById("phoneNumber").value;
        if (phoneNumber.length !== 11 || isNaN(phoneNumber)) {
            alert("Invalid phone number");
            event.preventDefault();
        }

        alert("Form submitted successfully!");
    });


</script>


</html>
